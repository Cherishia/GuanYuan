services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      GUANYUAN_RELAY_KEY: ${GUANYUAN_RELAY_KEY:?Set a random 64-character hex key in .env}
    expose:
      - "18779"
    mem_limit: 128m
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GUANYUAN_DOMAIN: ${GUANYUAN_DOMAIN:?Set your relay domain in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay
volumes:
  caddy_data:
  caddy_config:
